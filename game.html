<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>لعبة مطابقة الأشكال - نسخة أطفال</title>
  <style>
    :root {
      --bg: #fff8f0;
      --card: #ffffff;
      --accent: #ff6b6b;
      --accent2: #ffd93d;
      --accent3: #66cc66;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(180deg, #fff8f0 0%, #fefefe 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
    }

    .game {
      width: 980px;
      max-width: 980px;
      background: var(--card);
      box-shadow: 0 14px 40px rgba(0, 0, 0, .08);
      border-radius: 20px;
      padding: 18px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    h1 {
      font-size: 24px;
      margin: 0;
      color: #333;
    }

    .controls { display: flex; gap: 10px; align-items: center; }
    button {
      background: linear-gradient(180deg, rgba(0,0,0,0.06), transparent);
      border: none;
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .play-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 14px;
      cursor: pointer;
    }

    .board { display: flex; gap: 18px; margin-top: 14px; }
    .tray, .targets {
      flex: 1;
      padding: 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, #fff, #fff4f0);
      min-height: 380px;
    }

    .tray {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-content: flex-start;
      justify-content: center;
      padding-top: 18px;
    }

    .draggable {
      width: 100px;
      height: 100px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      background: #fff;
      box-shadow: 0 10px 20px rgba(0, 0, 0, .06);
      flex-direction: column;
    }

    .draggable:active { cursor: grabbing; }

    .shape { width: 64px; height: 64px; }

    .targets {
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
      justify-content: center;
    }

    .target {
      width: 160px;
      height: 120px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fff, #fffbf7);
      border: 2px dashed rgba(0, 0, 0, .06);
      position: relative;
    }

    .target.highlight {
      box-shadow: 0 6px 18px rgba(43,108,176,.08);
      transform: scale(1.02);
      transition: transform .14s;
    }

    .meta { display: flex; gap: 12px; align-items: center; }
    .badge {
      padding: 6px 10px;
      border-radius: 12px;
      background: #fff8ea;
      border: 1px solid rgba(0, 0, 0, .03);
      font-weight: 700;
    }

    .level-name, .score { font-weight: 800; color: #222; }

    .footer { margin-top: 12px; text-align: center; color: #444; }
    small { color: #666; }
    .hidden { display: none; }

    .big-msg {
      position: fixed;
      left: 50%;
      top: 40%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, #fff, #fffaf0);
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .14);
      text-align: center;
      z-index: 60;
    }

    video.clap-video {
      width: 220px;
      height: auto;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    img.logo {
      height: 80px;
      width: 80px;
      object-fit: contain;
      margin-top: 6px;
    }

    @media (max-width: 980px) {
      .game { width: 95%; }
      .board { flex-direction: column-reverse; }
      .targets { flex-direction: row; flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="game" role="application" aria-label="لعبة مطابقة الأشكال - للأطفال">
    <header>
      <div>
        <h1>🎨 لعبة مطابقة الأشكال — للأطفال 🎈</h1>
        <img src="logo.png" class="logo" alt="شعار اللعبة">
        <div style="font-size:13px;color:#666">
          نسخة الألوان: أحمر - أصفر - أخضر 🌈 مع موسيقى ومراحل ممتعة.
        </div>
      </div>

      <div class="controls">
        <div class="meta">
          <div class="badge level-name">المستوى: <span id="levelName">سهل</span></div>
          <div class="badge score">النقاط: <span id="score">0</span></div>
        </div>
        <button id="restart">إعادة</button>
        <button id="musicToggle" class="play-btn">تشغيل الموسيقى 🎵</button>
      </div>
    </header>

    <div class="board">
      <section class="tray" id="tray" aria-label="الأشكال المتاحة"></section>
      <section class="targets" id="targets" aria-label="المربعات المستهدفة"></section>
    </div>

    <div class="footer">
      <small>اسحب الشكل وضعه على المربع المتطابق. بعد الفوز يظهر فيديو 👏</small>
    </div>
  </div>
