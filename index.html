<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>روضة حديقة الطفل النموذجية</title>
<style>
  body {
    background: linear-gradient(135deg, #8ecae6, #219ebc, #ffb703);
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: "Comic Sans MS", sans-serif;
    color: #fff;
    overflow: hidden;
  }

  h1 {
    font-size: 2.5em;
    margin-bottom: 25px;
    text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
  }

  p {
    font-size: 1.2em;
    margin-bottom: 35px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
  }

  button {
    background-color: #06d6a0;
    border: none;
    padding: 15px 45px;
    font-size: 1.3em;
    border-radius: 30px;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: all 0.3s ease;
  }

  button:hover {
    transform: scale(1.1);
    background-color: #118ab2;
  }

  .logo {
    width: 280px;
    margin-bottom: 20px;
    animation: bounce 2s infinite;
  }

  @keyframes bounce {
    0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-15px); }
    60% { transform: translateY(-7px); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1, p, button {
    animation: fadeIn 1.5s ease forwards;
  }
</style>
</head>
<body>

<img src="logo.png" alt="شعار روضة حديقة الطفل" class="logo">

<h1>🌷 مرحباً بكم في لعبة روضة حديقة الطفل النموذجية 🌼</h1>
<p>هيا نلعب ونتعلم في عالمٍ مليءٍ بالألوان والمرح! 🎶</p>

<button onclick="playSound(); startGame();">ابدأ اللعب 🎮</button>

<!-- صوت الخلفية -->
<audio id="bgAudio" loop>
  <source src="background-audio.m4a" type="audio/mpeg">
</audio>

<!-- صوت الزر -->
<audio id="clickSound">
  <source src="click.mp3" type="audio/mpeg">
</audio>
  <!-- زر تفعيل الصوت -->
<div id="soundPrompt" 
     style="position:fixed;top:0;left:0;width:100%;height:100%;
     background:rgba(255,255,255,0.95);display:flex;align-items:center;
     justify-content:center;flex-direction:column;z-index:9999;text-align:center;">
  <h2 style="font-family:'Comic Sans MS';color:#444;">🎵 اضغط لتشغيل الموسيقى والأصوات</h2>
  <button id="enableSoundBtn" 
          style="background:#ff4d4d;color:#fff;font-size:20px;
          border:none;padding:12px 28px;border-radius:20px;cursor:pointer;
          box-shadow:0 6px 16px rgba(0,0,0,0.1);">
    تشغيل الصوت 🎶
  </button>
</div>

<script>
// === إصلاح وتشغيل الصوت على الأجهزة المحمولة (iPad / iPhone) ===
const enableSoundBtn = document.getElementById('enableSoundBtn');
const soundPrompt = document.getElementById('soundPrompt');
const bgMusic = document.getElementById('bgMusic');

enableSoundBtn.addEventListener('click', () => {
  // تشغيل الموسيقى الخلفية
  if (bgMusic && bgMusic.paused) {
    bgMusic.volume = 0.4;
    bgMusic.play().catch(()=>{});
  }

  // تفعيل باقي الأصوات
  [soundCorrect, soundWrong, soundNextLevel].forEach(a => {
    a.volume = 0; // تشغيل بدون صوت أولاً
    a.play().then(() => {
      a.pause();
      a.currentTime = 0;
      a.volume = 1; // بعد التشغيل نرجع الصوت
    }).catch(()=>{});
  });

  // إخفاء النافذة بعد التفعيل
  soundPrompt.style.opacity = '0';
  soundPrompt.style.transition = 'opacity 0.6s';
  setTimeout(() => soundPrompt.style.display = 'none', 600);
});
</script>


<script>
  const bgAudio = document.getElementById('bgAudio');
  const clickSound = document.getElementById('clickSound');

  // نحاول تشغيل الصوت تلقائياً
  window.addEventListener('DOMContentLoaded', () => {
    bgAudio.volume = 0.4;
    bgAudio.play().catch(() => {
      // إذا المتصفح رفض التشغيل، ننتظر أول نقرة
      document.body.addEventListener('click', () => {
        bgAudio.play().catch(()=>{});
      }, { once: true });
    });
  });

  // تشغيل صوت عند النقر (مثلاً على زر)
  function playClickSound() {
    clickSound.currentTime = 0;
    clickSound.play();
  }

 function playSound() {
  clickSound.currentTime = 0;
  clickSound.play();

  if(bgAudio.paused) {
    bgAudio.volume = 0.4;
    bgAudio.play().catch(()=>{});
  }
     // إيقاف الموسيقى عند الانتقال للصفحة الجديدة
  bgAudio.pause();
  startGame();
}

  function startGame() {
    const win = window.open('game.html', '_blank');
    if (win) {
      win.focus();
      win.document.body.requestFullscreen?.();
    }
  }
</script>
</body>
</html>
