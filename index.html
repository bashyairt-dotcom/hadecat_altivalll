<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>روضة حديقة الطفل النموذجية</title>
  <style>
    body {
      background: linear-gradient(135deg, #8ecae6, #219ebc, #ffb703);
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      font-family: "Comic Sans MS", sans-serif;
      color: #fff;
      overflow: hidden;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 25px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    }

    p {
      font-size: 1.2em;
      margin-bottom: 35px;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.2);
    }

    button {
      background-color: #06d6a0;
      border: none;
      padding: 15px 45px;
      font-size: 1.3em;
      border-radius: 30px;
      cursor: pointer;
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
      background-color: #118ab2;
    }

    /* ستايل الشعار */
    .logo {
      width: 280px;
      margin-bottom: 20px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-15px); }
      60% { transform: translateY(-7px); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1, p, button {
      animation: fadeIn 1.5s ease forwards;
    }
  </style>
</head>
<body>
  <!-- شعار اللعبة -->
  <img src="logo.png" alt="شعار روضة حديقة الطفل" class="logo">

  <h1>🌷 مرحباً بكم في لعبة روضة حديقة الطفل النموذجية 🌼</h1>
  <p>هيا نلعب ونتعلم في عالمٍ مليءٍ بالألوان والمرح! 🎶</p>

  <button onclick="playSound(); startGame();">ابدأ اللعب 🎮</button>

  <!-- موسيقى ترحيبية وصوت المؤثر -->
  <audio id="bgMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2023/04/18/audio_7b4cc2f444.mp3?filename=happy-background-music-145990.mp3" type="audio/mpeg">
  </audio>

  <audio id="clickSound">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3e1f6e0e83.mp3?filename=click-124467.mp3" type="audio/mpeg">
  </audio>

  <script>
    // تشغيل الموسيقى الترحيبية بهدوء عند أول نقرة
    window.addEventListener('DOMContentLoaded', () => {
      const bgMusic = document.getElementById('bgMusic');
      bgMusic.volume = 0.4;
      document.body.addEventListener('click', () => {
        if (bgMusic.paused) bgMusic.play().catch(()=>{});
      }, { once: true });
    });

    // تشغيل صوت الزر
    function playSound() {
      const clickSound = document.getElementById('clickSound');
      clickSound.currentTime = 0;
      clickSound.play();
    }

    // فتح اللعبة
    function startGame() {
      const win = window.open('game.html', '_blank');
      if (win) {
        win.focus();
        win.document.body.requestFullscreen?.();
      }
    }
  </script>
</body>
</html>
